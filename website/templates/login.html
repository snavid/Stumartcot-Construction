<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Stumarcot Admin</title>
    <meta name="robots" content="noindex, nofollow">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='Minimalist_House_Logo_Design-removebg-preview.png') }}">
</head>
<body class="admin-body admin-login">

<div>
    <div class="ad-login-card">
        <div class="ad-login-brand">
            <img src="{{ url_for('static', filename='Minimalist_House_Logo_Design-removebg-preview.png') }}" alt="Stumarcot">
            <h1>STUMARCOT</h1>
            <p>Sign in to the admin panel</p>
        </div>

        {% include "_flash.html" %}

        <form method="POST">
            <div class="ad-field">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" placeholder="you@stumarcot.co.tz" required autofocus>
            </div>

            <div class="ad-field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="ad-btn ad-btn-primary">
                <i class="fas fa-right-to-bracket"></i> Sign in
            </button>
        </form>
    </div>

    <a href="{{ url_for('views.home') }}" class="ad-back-link">
        <i class="fas fa-arrow-left"></i> Back to stumarcot.co.tz
    </a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
