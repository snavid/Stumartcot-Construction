{% extends "base.html" %}
{% block title %}Add Category - Stumarcot Admin{% endblock %}
{% block page_title %}Add Category{% endblock %}

{% block content %}
<div class="ad-pagehead">
    <div>
        <h2>Add Category</h2>
        <p>Categories group your products together.</p>
    </div>
    <a href="{{ url_for('views.manage_categories') }}" class="ad-btn ad-btn-ghost">
        <i class="fas fa-arrow-left"></i> Back to categories
    </a>
</div>

<div class="ad-card" style="max-width: 720px;">
    <div class="ad-card-body">
        <form method="POST" enctype="multipart/form-data">
            <div class="ad-field">
                <label for="name">Category name <span class="req">*</span></label>
                <input type="text" id="name" name="name" placeholder="e.g. Floor Tiles" required>
            </div>

            <div class="ad-field">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="4"
                          placeholder="Briefly describe this category..."></textarea>
            </div>

            <div class="ad-field">
                <label for="image">Category image</label>
                <input type="file" id="image" name="image" accept="image/*">
                <div class="ad-hint">PNG, JPG, JPEG, GIF or AVIF.</div>
            </div>

            <div class="ad-form-actions">
                <a href="{{ url_for('views.manage_categories') }}" class="ad-btn ad-btn-ghost">Cancel</a>
                <button type="submit" class="ad-btn ad-btn-primary">
                    <i class="fas fa-check"></i> Add Category
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
